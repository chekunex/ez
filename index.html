<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHEKUNEX — CS2 Pro Gaming</title>
  <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/main.css">
</head>
<body>
  <div class="bg-wrap">
    <img class="bg-gif bg-desktop" src="assets/backgrounds/background-desktop.gif" alt="" aria-hidden="true">
    <img class="bg-gif bg-mobile" src="assets/backgrounds/background-mobile.gif" alt="" aria-hidden="true">
  </div>
  <div class="bg-overlay"></div>
  <header class="header">
    <div class="header-inner">
      <div class="logo" id="logoBtn">CHEKUNEX</div>
      <nav class="nav">
        <a id="nav-profile" class="active">Главная</a>
        <a id="nav-guides">Гайды</a>
      </nav>
      <div class="header-right"><img class="avatar-small" src="https://avatars.fastly.steamstatic.com/25f4bf83b53d3f5722e76bcd8d0f8a3aebb3e9b3_full.jpg" alt="avatar"></div>
    </div>
  </header>
  <div class="sub-header" id="subHeader">
    <div class="sub-header-inner">
      <a class="bread-link" id="breadHome" onclick="navigate('profile')">Главная</a>
      <span class="sep">→</span>
      <a class="bread-link" id="breadGuidesLink" onclick="navigate('guides')">Гайды</a>
      <span class="sep" id="breadSepTitle">→</span>
      <span class="bread-current" id="breadTitle"></span>
    </div>
  </div>
  <div class="page-content" id="pageContent">
    <div class="page active" id="pageProfile">
      <div class="profile-card">
        <div class="profile-avatar-wrap">
          <img class="profile-avatar" src="https://avatars.fastly.steamstatic.com/25f4bf83b53d3f5722e76bcd8d0f8a3aebb3e9b3_full.jpg" alt="avatar">
          <div class="profile-status"></div>
        </div>
        <div class="profile-info">
          <div class="profile-name"><span class="accent">Чекунец</span></div>
          <div class="profile-tags">
            <span class="tag tag-pro">Pro Player</span>
            <span class="tag tag-cs2">CS2</span>
            <span class="tag tag-guide">Guide Maker</span>
          </div>
          <div class="profile-desc">Киберспортсмен, тренер по CS2 и автор гайдов. В игре с 2020. Живу на Mirage.</div>
          <a class="steam-link" href="https://steamcommunity.com/id/imcavs" target="_blank" rel="noopener">Открыть Steam профиль &rarr;</a>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-cell"><div class="stat-val">2,481</div><div class="stat-label">Часов в CS2</div></div>
        <div class="stat-cell"><div class="stat-val">18.6K</div><div class="stat-label">Followers</div></div>
        <div class="stat-cell"><div class="stat-val">87</div><div class="stat-label">Гайдов</div></div>
        <div class="stat-cell"><div class="stat-val">8,548</div><div class="stat-label">Просмотров</div></div>
        <div class="stat-cell"><div class="stat-val">Global</div><div class="stat-label">Ранг</div></div>
      </div>
      <div class="section-title">Гайды <span class="count" id="profileCount"></span></div>
      <div class="guides-list" id="guidesList"></div>
    </div>
    <div class="page" id="pageGuides">
      <div class="section-title">Все гайды <span class="count" id="guidesCount"></span></div>
      <div class="guides-list" id="guidesListFull"></div>
    </div>
    <div class="page" id="pageGuideView"><div id="guideContent"></div></div>
  </div>
  <script src="guides/data.js"></script>
  <script src="guides/mirage.js"></script>
  <script src="guides/awp.js"></script>
  <script src="guides/niveus.js"></script>
  <script src="guides/bhop.js"></script>
  <script src="guides/valera.js"></script>
  <script src="guides/ak47.js"></script>
  <script src="guides/shooting.js"></script>
  <script src="guides/deagle.js"></script>
  <script src="guides/full.js"></script>
  <script src="guides/secrets.js"></script>
  <script src="guides/helpers.js"></script>
</body>
</html>
