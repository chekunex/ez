+ '<h3>Настройка Windows</h3>'
+ '<p>Windows потребляет значительные ресурсы системы, которые можно освободить для CS2. Вот список обязательных настроек:</p>'
+ '<ul><li><strong>Отключение Game Bar и Xbox Game Bar</strong> — Настройки → Игры → Xbox Game Bar → Выкл. Эти службы постоянно работают в фоне и потребляют ресурсы.</li><li><strong>Включение аппаратного ускорения GPU (HAGS)</strong> — Настройки → Система → Экран → Графика → Изменить параметры графики по умолчанию → Аппаратное ускорение GPU → Вкл. Улучшает производительность на современных видеокартах.</li><li><strong>Отключение сенсорной клавиатуры</strong> — Служба сенсорной клавиатуры может вызывать микро-фризы. Отключите через службы Windows (services.msc).</li><li><strong>Отключение залипания клавиш</strong> — Панель управления → Центр специальных возможностей → Упрощение работы с клавиатурой → Отключить залипание клавиш.</li><li><strong>Оптимизация доставки (Delivery Optimization)</strong> — Настройки → Центр обновления Windows → Дополнительные параметры → Оптимизация доставки → Разрешить загрузку с других компьютеров → Выкл.</li><li><strong>Автозагрузка</strong> — Оставьте только Steam и ваш браузер. Все остальное отключите через Диспетчер задач → Автозагрузка.</li><li><strong>Электропитание</strong> — Панель управления → Электропитание → Высокая производительность. Или используйте схему «Максимальная производительность» через <code>powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61</code>.</li></ul>'
+ '<h3>Улучшение регистрации попаданий</h3>'
+ '<p>Регистрация попаданий (hit registration) — одна из самых важных механик в CS2. Следующие команды помогут улучшить стабильность подключения и регистрацию выстрелов:</p>'
+ '<ul><li><strong>cl_net_buffer_ticks 0</strong> — Убирает буферизацию сетевых пакетов, снижая задержку ввода.</li><li><strong>rate 786432</strong> — Максимальная скорость передачи данных. Гарантирует, что сервер отправляет вам максимальное количество информации.</li><li><strong>cl_itemimages_dynamically_generated 0</strong> — Отключает динамическую генерацию изображений предметов, снижая нагрузку на CPU.</li><li><strong>engine_no_focus_sleep 0</strong> — Предотвращает снижение FPS при сворачивании игры или переключении окон.</li></ul>'
+ '<p>Эти команды рекомендуется добавить в ваш autoexec.cfg для автоматического применения при запуске игры.</p>'
+ '<h3>Настройка звука</h3>'
+ '<p>Звук в CS2 — ключевой элемент situational awareness. Правильная настройка звука позволяет слышать шаги противников, определять их позицию и принимать правильные решения.</p>'
+ '<ul><li><strong>Громкость (Volume)</strong> — 90%. Слишком высокая громкость может искажать звук и вызывать утомление.</li><li><strong>Эквалайзер (EQ)</strong> — Четкий (Clear). Подчеркивает звуки шагов и выстрелов, приглушая низкие частоты.</li><li><strong>Изоляция боковых каналов (L/R Isolation)</strong> — 15%. Помогает лучше определять направление звука.</li><li><strong>Коррекция перспективы (Perspective Correction)</strong> — Включено. Адаптирует звук в зависимости от положения камеры и угла обзора.</li></ul>'
+ '<p>Дополнительно рекомендуется использовать качественные игровые наушники с объемным звуком. Настройте звук в Windows на 16 бит 48000 Гц (CD-качество) для минимизации задержки.</p>'
+ '<h3>Настройка интерфейса</h3>'
+ '<p>Интерфейс должен быть информативным, но не отвлекающим. Вот рекомендации по настройке каждого элемента HUD:</p>'
+ '<h4>Размер интерфейса (HUD Scale)</h4>'
+ '<p>Установите комфортный размер элементов HUD. Рекомендуется 0.8-1.0 для большинства разрешений. Слишком крупный HUD перекрывает обзор, слишком мелкий — нечитаем.</p>'
+ '<h4>Радар (Radar)</h4>'
+ '<p>Настройте радар на максимальное увеличение — 2.0-3.0. Это позволит видеть всю карту и позиции союзников. Включите отображение иконок и линий видимости. Команды: <code>cl_radar_always_centered 0</code>, <code>cl_radar_scale 0.5-0.7</code>.</p>'
+ '<h4>Прицел (Crosshair)</h4>'
+ '<p>Выберите статичный прицел яркого цвета (зеленый, голубой или розовый). Размер 2-3, толщина 1-2, Gap -2 до 0. Прозрачность 100%. Не используйте динамический прицел — он расширяется при движении и стрельбе, что мешает прицеливанию.</p>'
+ '<h4>Прицел для гранаты (Grenade Crosshair)</h4>'
+ '<p>Включите отдельный прицел для гранат <code>cl_crosshairstyle 2</code>. Используйте команду <code>cl_showgrenadepreview 1</code> для отображения траектории полета гранаты.</p>'
+ '<h4>Телеметрия (Net Graph)</h4>'
+ '<p>Включите net_graph через <code>net_graph 1</code>. Позиция — <code>net_graphpos 1</code> (правая сторона). Следите за показателями loss, choke и var. При loss выше 0% — проблемы с подключением.</p>'
+ '<h3>Настройка рук (Viewmodel)</h3>'
+ '<p>Положение рук и оружия на экране — вопрос личного комфорта, но есть оптимальные значения, которые используют большинство про-игроков:</p>'
+ '<ul><li><strong>viewmodel_fov</strong> — 54-68. Определяет, насколько близко оружие расположено к камере. 54 — классика CS:GO, 68 — современный стандарт.</li><li><strong>viewmodel_offset_x</strong> — от -2 до 2. Горизонтальное смещение. Отрицательные значения смещают оружие влево.</li><li><strong>viewmodel_offset_y</strong> — от -2 до 2. Глубина. Отрицательные значения отодвигают оружие от камеры.</li><li><strong>viewmodel_offset_z</strong> — от -2 до 2. Вертикальное смещение. Отрицательные значения опускают оружие ниже.</li></ul>'
+ '<h4>Бинд на смену руки</h4>'
+ '<p>Некоторые игроки используют бинд для переключения руки с правой на левую: <code>bind "H" "toggle cl_righthand 0 1"</code>. Это может помочь при игре за определенными углами.</p>'
+ '<h4>Смена руки в настройках</h4>'
+ '<p>В меню Настройки → Управление → Предметы перетаскивания → Правша/Левша. Изменение руки влияет на видимость углов при пикинге.</p>'
+ '<h3>Создание своего CFG</h3>'
+ '<p>CFG (конфигурационный файл) — это текстовый файл с набором команд, который автоматически выполняется при запуске CS2. Создание собственного CFG позволяет сохранить все настройки, бинды и алиасы и быстро перенести их на другой компьютер.</p>'
+ '<h4>Шаблон autoexec.cfg</h4>'
+ '<p>Создайте текстовый файл с именем <code>autoexec.cfg</code> в блокноте или любом текстовом редакторе.</p>'
+ '<h4>Создание файла</h4>'
+ '<p>Файл должен быть сохранен в папке: <code>Steam\\steamapps\\common\\Counter-Strike Global Offensive\\game\\csgo\\cfg</code> (или <code>...\\Counter-Strike 2\\game\\csgo\\cfg</code>).</p>'
+ '<h4>Команды clear и echo</h4>'
+ '<p>Используйте <code>clear</code> для очистки консоли и <code>echo "текст"</code> для вывода сообщений при загрузке CFG. Это поможет проверить, что файл загрузился корректно.</p>'
+ '<h4>Путь к папке cfg</h4>'
+ '<p>Полный путь: <code>C:\\Program Files (x86)\\Steam\\steamapps\\common\\Counter-Strike Global Offensive\\game\\csgo\\cfg\\autoexec.cfg</code>. Убедитесь, что файл имеет расширение .cfg, а не .cfg.txt.</p>'
+ '<h4>Запуск через exec</h4>'
+ '<p>Добавьте в параметры запуска CS2 в Steam: <code>+exec autoexec.cfg</code>. Либо вводите в консоль <code>exec autoexec.cfg</code> вручную после каждого запуска игры.</p>'
+ '<h3>Советы для новичков</h3>'
+ '<p>Counter-Strike 2 — требовательная игра, которая прощает далеко не все ошибки. Вот ключевые советы для тех, кто только начинает:</p>'
+ '<ul><li><strong>Использовать наушники и микрофон</strong> — Это обязательный минимум. В наушниках вы слышите шаги, выстрелы и гранаты. Микрофон нужен для коммуникации с командой. Без этого вы будете обузой для тиммейтов.</li><li><strong>Не ругаться</strong> — Токсичность разрушает командную игру. Если вы начинаете флеймить, команда теряет концентрацию и проигрывает. Даже если тиммейт играет плохо, поддержка работает лучше критики.</li><li><strong>Использовать Shift (ходить бесшумно)</strong> — Клавиша Shift по умолчанию включает режим бесшумного хождения. Используйте её всегда, когда подходите к углам или подозреваете присутствие врага рядом. Шум шагов слышен за 10-15 метров.</li><li><strong>Прятаться за укрытиями</strong> — Никогда не стойте на открытом пространстве. Всегда перемещайтесь от укрытия к укрытию. Если началась перестрелка — сразу прячьтесь за ближайший ящик или стену.</li><li><strong>Не бежать с бомбой первым</strong> — Если у вас бомба, не бегите впереди всех. Вы — самый ценный игрок в раунде. Пусть тиммейты проверяют углы и зачищают территорию, а вы следуете за ними.</li><li><strong>Выучить клавиши и позиции на картах</strong> — Начните с одной-двух карт (Mirage и Dust 2 — самые популярные). Выучите названия позиций, точек установки бомбы и основных путей.</li><li><strong>Экономить деньги</strong> — Не покупайте оружие каждый раунд. Следите за экономикой команды. Если команда экономит — покупайте только пистолет и броню. На эко-раундах используйте Deagle или SMG.</li><li><strong>Следить за про-игроками</strong> — Смотрите стримы и турниры профессиональных игроков. Обращайте внимание на их позиции, раскидки гранат и принятие решений. Это лучший способ учиться.</li></ul>'
+ '<h3>Позиции на картах</h3>'
+ '<p>Знание позиций на картах — база, без которой невозможно прогрессировать. Вот основные позиции на популярных соревновательных картах:</p>'
+ '<h4>Ancient</h4>'

+ '<h4>Anubis</h4>'
+ '<p>Самая свежая карта в активном пуле, созданная сообществом. Египетская тематика, две точки установки. Особенность — множество вертикальных позиций и нестандартных углов. Ключевые зоны: Мид, A-Main, B-Long, Связка (Bridge).</p>'
+ '<h4>Dust II</h4>'

+ '<h4>Inferno</h4>'

+ '<h4>Nuke</h4>'

+ '<h3>Карты для тренировок из Steam Workshop</h3>'

+ '<h3>Команды для тренировок</h3>'
+ '<p>Для тренировки в одиночной игре с ботами используйте следующие консольные команды. Все они требуют включенных читов (<code>sv_cheats 1</code>):</p>'
+ '<ul><li><strong>sv_cheats 1</strong> — Включает режим читов. Обязательна для всех тренировочных команд.</li><li><strong>noclip</strong> — Режим полета сквозь стены. Полезен для изучения карты и раскидок гранат.</li><li><strong>bot_add_ct / bot_add_t</strong> — Добавляет ботов на сторону КТ или Т. Можно указать количество: <code>bot_add_ct 5</code>.</li><li><strong>bot_difficulty 0-3</strong> — Уровень сложности ботов: 0 — легкий, 3 — сложный (эксперт).</li><li><strong>bot_place</strong> — Размещает бота в точке, куда вы смотрите. Полезно для отработки префаеров и фликов.</li><li><strong>bot_kick</strong> — Удаляет всех ботов с карты.</li><li><strong>sv_infinite_ammo 1</strong> — Бесконечные патроны. Не нужно перезаряжаться.</li><li><strong>sv_grenade_trajectory 1</strong> — Показывает траекторию полета гранаты. Обязательно для изучения раскидок.</li><li><strong>mp_startmoney 16000</strong> — Устанавливает стартовое количество денег. Максимум — 16000.</li><li><strong>mp_buytime 9999</strong> — Бесконечное время на покупку оружия.</li><li><strong>mp_buy_anywhere 1</strong> — Возможность покупать оружие в любой точке карты.</li><li><strong>mp_restart_game 1</strong> — Перезапускает игру. Все сбрасывается до начального состояния.</li><li><strong>mp_warmup_start / mp_warmup_end</strong> — Начинает / заканчивает разминку.</li><li><strong>mp_maxrounds 30</strong> — Устанавливает максимальное количество раундов в матче.</li><li><strong>mp_roundtime 1.75</strong> — Время раунда в минутах (1.45 = 1 минута 45 секунд — стандарт).</li></ul>'
+ '<h3>Бинды для тренировок</h3>'
+ '<p>Бинды (привязки клавиш) значительно ускоряют тренировку. Вот набор полезных биндов для тренировочного сервера:</p>'
+ '<ul><li><strong>Стартовый бинд</strong> — <code>bind "F1" "mp_restart_game 1; mp_warmup_end"</code> — Быстрый перезапуск раунда.</li><li><strong>noclip</strong> — <code>bind "F2" "noclip"</code> — Быстрый полет сквозь стены.</li><li><strong>Повтор гранаты</strong> — <code>bind "F3" "sv_rethrow_last_grenade"</code> — Повторяет последнюю брошенную гранату. Идеально для тренировки раскидок.</li><li><strong>Ускорение времени</strong> — <code>bind "F4" "toggle host_timescale 0.5 1 2"</code> — Переключение скорости игры. 2x — ускорение, 0.5x — замедление.</li><li><strong>Бот на позицию</strong> — <code>bind "F5" "bot_stop 1; bot_add; bot_place"</code> — Добавляет бота и размещает его перед вами.</li><li><strong>Зеркальный бот</strong> — <code>bind "F6" "bot_mimic 1"</code> — Бот повторяет ваши движения. Полезно для тренировки контр-стрейфа и дуэлей.</li><li><strong>Удаление ботов</strong> — <code>bind "F7" "bot_kick"</code> — Быстрое удаление всех ботов.</li></ul>'
+ '<h3>Просмотр демок (Demolition / Demo Playback)</h3>'
+ '<p>Просмотр демок — один из самых эффективных способов анализа своей игры и обучения. Вот как настроить просмотр:</p>'
+ '<ul><li><strong>demoui</strong> — Открывает интерфейс управления демкой. Отображает панель с кнопками воспроизведения, перемотки и управления скоростью.</li><li><strong>cl_draw_only_deathnotices 1</strong> — Показывает только уведомления о смертях. Убирает лишний HUD для чистого обзора.</li><li><strong>cl_drawhud 0</strong> — Полностью отключает HUD. Используется для создания скриншотов и видео.</li><li><strong>spec_show_xray 1</strong> — Включает рентгеновское зрение. Показывает позиции всех игроков сквозь стены.</li></ul>'
+ '<h4>Управление демкой</h4>'

+ '<h4>Замедление и ускорение</h4>'

+ '<h4>Вид от третьего лица</h4>'

+ '<h3>Анализ демок</h3>'
+ '<p>Просто смотреть демки недостаточно — нужно анализировать их правильно. Вот методология эффективного разбора:</p>'
+ '<ul><li><strong>Записывать ошибки</strong> — Ведите заметки во время просмотра. Записывайте каждый момент, где вы сыграли неправильно: выбрали не ту позицию, не проверили угол, выстрелили слишком рано.</li><li><strong>Находить причинно-следственные связи</strong> — Не спрашивайте «почему я умер?», спрашивайте «какое решение привело к моей смерти?». Часто причина смерти кроется за 10-15 секунд до самого момента смерти.</li><li><strong>Фокусироваться на хороших моментах</strong> — Отмечайте не только ошибки, но и удачные решения. Анализируйте, почему решение сработало, чтобы повторять его в будущем.</li><li><strong>Не бояться ошибаться</strong> — Ошибки — это точки роста. Каждая проигранная дуэль, каждое неправильное решение — это урок. Не корите себя, а делайте выводы.</li><li><strong>Сравнивать с про-игроками</strong> — Скачайте демку профессионального игрока на той же карте и в той же ситуации. Сравните свои решения с его. Обратите внимание на позиционирование, тайминги и раскидки.</li></ul>'
+ '<h3>Повышение фактора доверия (Trust Factor)</h3>'
+ '<p>Trust Factor — система подбора соперников в CS2, основанная на поведении игрока. Высокий Trust Factor гарантирует игры с адекватными соперниками. Вот как его повысить:</p>'
+ '<ul><li><strong>Включить Steam Guard</strong> — Защита аккаунта через мобильный аутентификатор. Обязательное условие для высокого Trust Factor.</li><li><strong>Публичный профиль</strong> — Сделайте ваш Steam профиль публичным, с заполненной информацией и настоящим аватаром. Пустые или приватные профили вызывают подозрения.</li><li><strong>Активность</strong> — Регулярно играйте в CS2 и другие игры в Steam. Чем старше и активнее ваш аккаунт, тем выше доверие.</li><li><strong>Без читов</strong> — Очевидно, но стоит упомянуть: никогда не используйте читы, даже в одиночной игре. Система VAC фиксирует все.</li><li><strong>Рекомендации от друзей</strong> — Система учитывает, кто у вас в друзьях. Если ваши друзья имеют высокий Trust Factor, это положительно влияет на ваш.</li><li><strong>Не кикать игроков без причины</strong> — Частые кики голосованием снижают Trust Factor. Кикайте только при явных нарушениях.</li><li><strong>Не блокировать игроков после матчей</strong> — Блокировка после каждого проигранного матча негативно сказывается на Trust Factor.</li><li><strong>Патруль (Overwatch)</strong> — Участвуйте в патруле. Активные патрульные получают повышенный Trust Factor.</li><li><strong>Оценивать руководства</strong> — Оставляйте оценки и отзывы к гайдам в Steam. Позитивная активность в сообществе повышает доверие.</li><li><strong>Добавлять друзей</strong> — Имейте активный список друзей. Общайтесь, играйте вместе, приглашайте в группы.</li></ul>'
+ '<h3>Запуск Hammer Editor без RTX</h3>'
+ '<p>Hammer Editor — официальный редактор карт для CS2. Он требует видеокарту с поддержкой RTX, но существует способ запустить его без RTX:</p>'
+ '<ul><li><strong>Скачать Workshop Tools</strong> — В Steam библиотеке выберите Counter-Strike 2 → Свойства → DLC → Отметьте «Counter-Strike 2 Workshop Tools». Дождитесь загрузки.</li><li><strong>Создать проект addon</strong> — После установки запустите Hammer Editor. Создайте новый проект (File → New) или откройте существующий. Выберите тип аддона.</li><li><strong>Настроить параметры запуска</strong> — В свойствах CS2 в Steam добавьте параметры: <code>-tools -nop4 -novr -noassert -insecure +sv_cheats 1</code>. Параметр <code>-noassert</code> отключает проверки, которые могут требовать RTX.</li><li><strong>Запуск через инструменты</strong> — Запускайте Hammer Editor через меню Steam → Библиотека → Инструменты → Counter-Strike 2 Workshop Tools. Если редактор не запускается, попробуйте добавить <code>-vulkan</code> или <code>-dx11</code> в параметры запуска.</li></ul>'
+ '<h3>Мои настройки / Заключение</h3>'
+ '<p>Это руководство — результат сотен часов игры, экспериментов с настройками и анализа профессиональных игроков. Все рекомендации проверены лично и работают в актуальной версии Counter-Strike 2.</p>'
+ '<p>Помните: никакие настройки не заменят практику. Используйте этот гайд как основу, но адаптируйте настройки под свой стиль игры. Экспериментируйте, пробуйте новое и главное — получайте удовольствие от игры.</p>'
+ '<p>Удачи на полях сражений, и пусть ваш аим всегда будет точен! Следите за обновлениями гайда — я регулярно обновляю его с выходом новых патчей CS2.</p>'
+ '<div class="guide-back"><a class="back-to-guides">← Назад к списку гайдов</a></div></div>';

    var SE = '<div class="guide-header"><div class="guide-header-meta"><span class="badge badge-cs2">Aim Guide</span><span class="meta-item">9 \u0430\u0432\u0433 2025</span><span class="meta-item">644 просмотра</span><span class="meta-item gold">★★★★☆</span></div><h1>Секреты стрельбы в CS2: попадать в голову с первого выстрела</h1><div class="author">by <strong>Чекунец</strong></div></div><div class="guide-body">'
+ '<p>Хочешь перестать спрейть в молоко и начать стабильно забирать врагов одним кликом? В CS2 результат даёт не только скорость реакции, но и техника, контроль и внимание к деталям. В этом руководстве собраны проверенные приёмы из практики киберспортсменов.</p>'

+ '<h3>1. Основа — стойка и прицеливание</h3>'
+ '<h4>Правильная стойка</h4>'
+ '<p>Всегда держись чуть сбоку от угла, чтобы минимизировать площадь, видимую врагу. Перед выстрелом остановись — движение сильно сбивает точность. Держи прицел на уровне головы даже во время перемещений. Это избавит от лишнего времени на прицеливание.</p>'
+ '<h4>Перемещение при стрельбе</h4>'
+ '<p>На близкой дистанции можно использовать стрейф-шот (движение A-D + выстрел в момент остановки). На дальней дистанции — стрельба только из статичной позиции.</p>'
+ '<h3>2. Настройка прицела под себя</h3>'
+ '<p>Прицел — твоя точка фокуса. Если он неудобен, ты теряешь десятки фрагов.</p>'
+ '<ul><li><strong>Цвет:</strong> яркий (циан, розовый, жёлтый), чтобы выделялся на фоне карты</li><li><strong>Толщина:</strong> минимальная, но заметная</li><li><strong>Динамика:</strong> только статичный прицел — расширяющийся при движении мешает контролю</li></ul>'
+ '<h3>3. Контроль отдачи (Spray Control)</h3>'
+ '<p>CS2 использует тот же принцип отдачи, что и CS:GO, но с обновлённой физикой. Чтобы стабильно попадать, нужно знать спрей каждого оружия.</p>'
+ '<ul><li><strong>AK-47:</strong> первые 8 пуль идут вверх, потом вправо-влево. Потяни мышь вниз, потом чуть влево-вправо</li><li><strong>M4A4/M4A1-S:</strong> отдача мягче, но тоже начинается с вертикального подъёма</li><li><strong>FAMAS / Galil:</strong> меньше отдача, но выше разброс — короткие очереди лучше</li></ul>'
+ '<h4>Тренировка отдачи</h4>'
+ '<p>Включи карту training_aim_csgo или аналог для CS2. Стреляй по стене, отслеживай рисунок пуль. Повторяй, пока не сможешь держать пули в одной точке.</p>'
+ '<h3>4. Техника стрельбы на разных дистанциях</h3>'
+ '<h4>Ближняя дистанция (0-10 м)</h4>'
+ '<p>Агрессивные стрейфы + 3-5 пуль сериями. Можно использовать спрей с контролем отдачи.</p>'
+ '<h4>Средняя дистанция (10-25 м)</h4>'
+ '<p>2-3 пули (burst-fire). Делай паузы между сериями для восстановления точности.</p>'
+ '<h4>Дальняя дистанция (25+ м)</h4>'
+ '<p>Только одиночные выстрелы. Фокус на идеальном наведении прицела перед кликом.</p>'
+ '<h3>5. Тренировка реакции и меткости</h3>'
+ '<p>Тренировки не должны быть нудными. Вместо часов с ботами используй:</p>'

+ '<p>15-20 минут тренировки перед каждой игрой лучше, чем 2 часа раз в неделю.</p>'
+ '<h3>6. Ошибки, из-за которых ты промахиваешься</h3>'

      var existing = document.getElementById('dynamicGuideReviews');
      if (existing) existing.remove();
      var shuffled = [].concat(reviews).sort(function() { return 0.5 - Math.random(); });
      var selected = shuffled.slice(0, Math.floor(Math.random() * 6) + 5);
      var html = '<div id="dynamicGuideReviews" class="guide-reviews"><h3>\u041e\u0442\u0437\u044b\u0432\u044b</h3>';
      var stars = {5:'\u2605\u2605\u2605\u2605\u2605',4:'\u2605\u2605\u2605\u2605\u2606',3:'\u2605\u2605\u2605\u2606\u2606',2:'\u2605\u2605\u2606\u2606\u2606',1:'\u2605\u2606\u2606\u2606\u2606'};
      for (var i = 0; i < selected.length; i++) {
        var r = selected[i];
        if (r.profanity) {
          html += '<div class="review-prof-wrap blurred"><div class="review-item"><div class="review-header"><span class="review-author">' + r.author + '</span><span class="review-rating">' + stars[r.stars] + '</span><span class="review-date">' + r.date + '</span></div><div class="review-text">' + r.text + '</div></div><div class="review-prof-overlay"><div class="warning-text">\u041e\u0442\u0437\u044b\u0432 \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u0442 \u043d\u0435\u0446\u0435\u043d\u0437\u0443\u0440\u043d\u0443\u044e \u043b\u0435\u043a\u0441\u0438\u043a\u0443</div><button class="warning-btn" onclick="this.parentElement.parentElement.classList.remove(\'blurred\')">\u041f\u043e\u043a\u0430\u0437\u0430\u0442\u044c \u043e\u0442\u0437\u044b\u0432</button></div></div>';
        } else {
          html += '<div class="review-item"><div class="review-header"><span class="review-author">' + r.author + '</span><span class="review-rating">' + stars[r.stars] + '</span><span class="review-date">' + r.date + '</span></div><div class="review-text">' + r.text + '</div></div>';
        }
      }
      html += '</div>';
      var guideBody = document.querySelector('.guide-body');
      if (guideBody) {
        var backBtn = guideBody.querySelector('.guide-back');
        if (backBtn) {
          backBtn.insertAdjacentHTML('beforebegin', html);
        } else {
          guideBody.insertAdjacentHTML('beforeend', html);
        }
      }

    function renderList(containerId) {
      var container = document.getElementById(containerId);
      container.innerHTML = '';
      GUIDES.forEach(function(g) {
        var row = document.createElement('div');
        row.className = 'guide-row';
        row.innerHTML = '<div class="guide-row-img"><img src="' + g.preview + '" alt="..." loading="lazy"></div><div class="guide-row-info"><div class="guide-row-title">' + g.title + '</div><div class="guide-row-meta"><span>by Чекунец</span><span class="dot">·</span><span>' + g.date + '</span><span class="dot">·</span><span>' + g.views + ' просмотров</span><span class="dot">·</span><span class="rating">★ ' + g.rating + '</span></div></div><div class="guide-row-arrow">→</div>';
        row.onclick = function() { navigate('guide', g.id); };
        container.appendChild(row);
      });
    }

    function handleHash() {
      var h = window.location.hash.slice(1);
      if (!h || h === 'profile') { navigate('profile'); return; }
      if (h === 'guides') { navigate('guides'); return; }
      var found = GUIDES.find(function(g) { return g.slug === h; });
      if (found) { navigate('guide', found.id); return; }
      navigate('profile');
    }

    document.getElementById('logoBtn').onclick = function() { navigate('profile'); };
    document.getElementById('nav-profile').onclick = function() { navigate('profile'); };
    document.getElementById('nav-guides').onclick = function() { navigate('guides'); };
    window.addEventListener('hashchange', handleHash);
    renderList('guidesList');
    renderList('guidesListFull');
    handleHash();
  </script>
